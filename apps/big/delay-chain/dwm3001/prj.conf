# This is the optional user-specific configuration file.

# CONFIG_LOG_RUNTIME_FILTERING=y

# For iot-lab, we need to use UART instead of RTT for logging:
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# CONFIG_LOG_BUFFER_SIZE=8192
# CONFIG_LOG_PROCESS_THREAD=y

# For RUDP:
# CONFIG_NET_TCP=n

CONFIG_IEEE802154_NRF5=n
CONFIG_IEEE802154_DW3000=y
CONFIG_IEEE802154_DW3000_RX_POLLING_MODE=n
CONFIG_IEEE802154_DW3000_LOG_LEVEL_WRN=y

# DW3000 UWB supports HRP UWB channels (use 5 or 9, not 2.4 GHz channel 26).
CONFIG_NET_CONFIG_IEEE802154_CHANNEL=5

# For the glossy broker and IEEE802.15.4 driver implementation,
# we need ALOHA for now. Also enable rtc timer user channels for the glossy LF implementation.
# TODO: This should be part of the auto-generated configs for the glossy broker and driver,
# not manually set here!
CONFIG_NET_L2_IEEE802154_RADIO_CSMA_CA=y
CONFIG_NET_L2_IEEE802154_RADIO_ALOHA=n
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=1

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=128


CONFIG_LF_RUDP_MAX_RETRIES=128
CONFIG_LF_RUDP_RETRANSMIT_TIMEOUT_MS=50
CONFIG_LF_RUDP_IP_CHANNEL_RECV_THREAD_STACK_SIZE=2048

# CONFIG_LF_RUDP_OUTGOING_BUFFER_SIZE=2

# CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=n
# CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# CONFIG_MAIN_STACK_SIZE=8192


# This _shouldn't_ be necessary, but for some reason our new UWB-driver based 802.15.4 driver
# doesn't work with ND and more than two devices. For federations of only two federates, it
# works, but for some reason it doesn't work for more than two.
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_ND=n