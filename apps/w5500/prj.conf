# Common Zephyr configuration for every generated PingPong federate.
# build.py copies this file into each generated project after lfc has run.

# W5500 Ethernet interface and Zephyr's native network stack.
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_W5500=y
CONFIG_SPI=y

# The W5500 Zephyr driver provides Ethernet frames, not an offloaded BSD
# socket implementation. Override the offload settings emitted by lfc so
# sockets are handled by Zephyr's native IPv4/TCP/UDP stack.
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=n
CONFIG_ETH_NATIVE_POSIX=n

# Protocols used by LF federated communication (TCP) and clock sync (UDP).
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Native sockets raise Zephyr's minimum system heap above lfc's 1 KiB default.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Static IPv4 configuration. build.py appends CONFIG_NET_CONFIG_MY_IPV4_ADDR
# for each federate using its @interface_tcp address from src/PingPong.lf.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW=""
CONFIG_NET_DHCPV4=n
CONFIG_NET_IPV4_AUTO=n

# Expose stdout, printk, and reactor-uc logs through the board's USB connector.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="LF W5500 Federate"
CONFIG_UART_LINE_CTRL=y

# Use the same USB CDC ACM device as an interactive Zephyr shell. The shell
# backend also multiplexes Zephyr logs without corrupting the command prompt.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=91
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="w5500:~$ "
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n

# Network inspection and diagnostics available below the `net` shell command.
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_MONITOR=y

# Suppress internal USB enumeration/control-transfer chatter. USB errors are
# intentionally suppressed too; CDC enumeration itself is visible on the host.
CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y

# Keep early driver failures buffered until the CDC console has initialized,
# and report Ethernet/network configuration failures on that console.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_NET_LOG=y
CONFIG_NET_CONFIG_LOG_LEVEL_INF=y
