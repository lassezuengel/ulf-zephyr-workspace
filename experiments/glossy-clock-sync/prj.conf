CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_DEBUG_INFO=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=n

CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=16384
# CONFIG_LOG_BLOCK_IN_THREAD=y
# CONFIG_LOG_BLOCK_IN_THREAD_TIMEOUT_MS=1000
CONFIG_LOG_PROCESS_THREAD=y

# Allow application RTC compare channels for precise scheduling
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=1

# Keep scheduler simple while debugging stability issues.
# CONFIG_TIMESLICING=n

CONFIG_IEEE802154_DW3000_LOG_LEVEL_INF=y

# Pull in DW3000 UWB driver sources used by Glossy API.
CONFIG_IEEE802154_DW3000=y
CONFIG_UWB_RANGING=n
CONFIG_IEEE802154_DW3000_RX_POLLING_MODE=n
CONFIG_IEEE802154_DW3000_EXCLUSIVE_UWB_MODE=n

# Core networking dependencies required by the DW3000 802.15.4 driver.
CONFIG_NETWORKING=y
# CONFIG_NET_IPV6=y
# CONFIG_NET_TCP=y
# CONFIG_NET_SOCKETS=y
# CONFIG_NET_CONNECTION_MANAGER=y
# CONFIG_POSIX_API=y

# Network buffers.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# IP address options.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=4
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MAX_CONN=10

# Disable shell to keep image small.
CONFIG_NET_SHELL=n
CONFIG_SHELL=n

# Network app config.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_CONFIG_MY_IPV6_ADDR=""
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_CONTEXT_RCVTIMEO=y

# IEEE802.15.4 stack config used by local driver.
CONFIG_BT=n
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=n
CONFIG_NET_L2_IEEE802154=y
CONFIG_NET_L2_IEEE802154_SHELL=n
CONFIG_NET_L2_IEEE802154_FRAGMENT_REASS_CACHE_SIZE=8
CONFIG_NET_L2_IEEE802154_RADIO_CSMA_CA=y
CONFIG_NET_L2_IEEE802154_RADIO_ALOHA=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""
CONFIG_NET_IPV6_ND=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_CONFIG_IEEE802154_CHANNEL=5

# Additional runtime sizing commonly used in LF-based builds.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_CBPRINTF_FP_SUPPORT=y
